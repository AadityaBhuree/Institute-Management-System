version: '3.8'

services:
  ims-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ims_enterprise_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IMS_DB_PATH=/app/data/ims.db
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
