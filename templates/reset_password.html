<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Institute Management System</title>
  <meta name="description" content="Self-service password recovery and credential update portal">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 50%),
                  var(--bg-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), 0 0 30px rgba(99, 102, 241, 0.2);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      font-size: 42px;
      display: inline-block;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }
    .form-input {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: rgba(255, 255, 255, 0.07);
    }
    .btn-submit {
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
      border: none;
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .auth-back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .auth-back-link a {
      color: var(--accent-primary);
      text-decoration: none;
    }
    .auth-back-link a:hover {
      text-decoration: underline;
    }
    .status-alert {
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .status-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    .status-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title">Password Recovery</h1>
        <p class="auth-subtitle">Self-service account recovery and security</p>
      </div>

      <div id="status-box" class="status-alert"></div>

      {% if token %}
      <!-- Stage 2: Token Present -> Set New Password -->
      <form id="reset-confirm-form" class="auth-form" onsubmit="handleResetPassword(event)">
        <input type="hidden" id="reset-token" value="{{ token }}">
        
        <div class="form-group">
          <label for="new-password" class="form-label">New Password (min 8 characters)</label>
          <input
            type="password"
            id="new-password"
            class="form-input"
            placeholder="••••••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm New Password</label>
          <input
            type="password"
            id="confirm-password"
            class="form-input"
            placeholder="••••••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="btn-reset-submit">
          Update Account Password
        </button>
      </form>
      {% else %}
      <!-- Stage 1: Request Password Recovery Link -->
      <form id="forgot-form" class="auth-form" onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label for="recovery-email" class="form-label">Registered Institutional Email</label>
          <input
            type="email"
            id="recovery-email"
            class="form-input"
            placeholder="scholar@institute.edu"
            required
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn-submit" id="btn-forgot-submit">
          Send Recovery Link
        </button>
      </form>
      {% endif %}

      <div class="auth-back-link">
        <a href="/login">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');

    function showStatus(message, isSuccess) {
      statusBox.className = 'status-alert ' + (isSuccess ? 'success' : 'error');
      statusBox.textContent = message;
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('recovery-email').value.trim();
      const btn = document.getElementById('btn-forgot-submit');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const data = await res.json();
        showStatus(data.message || 'Recovery instructions dispatched.', true);
        if (data.reset_token) {
          // In test/dev environment, show link directly
          const link = `/reset-password?token=${data.reset_token}`;
          statusBox.innerHTML += `<br><br><strong>Dev Mode Token:</strong> <a href="${link}" style="color: inherit; text-decoration: underline;">Click here to reset password</a>`;
        }
      } catch (err) {
        showStatus('Network error occurred. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Recovery Link';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const token = document.getElementById('reset-token').value.trim();
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;
      const btn = document.getElementById('btn-reset-submit');

      if (newPass !== confirmPass) {
        showStatus('Passwords do not match. Please verify.', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: newPass })
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(data.detail || 'Password reset failed.', false);
        } else {
          showStatus(data.message || 'Password successfully updated!', true);
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        }
      } catch (err) {
        showStatus('Network error occurred. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Account Password';
      }
    }
  </script>
</body>
</html>
